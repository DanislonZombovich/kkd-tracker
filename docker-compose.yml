services:
  postgres:
    image: postgres:16-alpine
    container_name: kkd-postgres
    restart: always
    environment:
      POSTGRES_DB: kkd_db
      POSTGRES_USER: kkd_user
      POSTGRES_PASSWORD: kkd_secret
    ports:
      - "5432:5432"
    volumes:
      - kkd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kkd_user -d kkd_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kkd-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/kkd_db
      DB_USER: kkd_user
      DB_PASSWORD: kkd_secret
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kkd-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  kkd_pgdata:
